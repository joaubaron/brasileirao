<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão Série A</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

.card {
text-align: center;
padding: 2rem;
}

.logo {
width: 230px;
height: 230px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 32px;
border-radius: 12px;
font-weight: bold;
font-size: 1rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.fluminense-logo {
width: 100px;
height: 100px;
margin-top: 2rem;
cursor: pointer;
border-radius: 12px;
display: block;
margin-left: auto;
margin-right: auto;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.fluminense-logo:active {
}

</style>
</head>
<body>
<div class="card">
<img src="icon-512.png" alt="Brasileirão" class="logo">
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br>
<img src="fluminense.png" alt="Fluminense" class="fluminense-logo" id="fluminenseBtn">
<p style="color: white; margin-top: 8px; font-size: 14px; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;" id="fluminenseText">Fluminense Football Club</p>
</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const fluminenseUrl = "https://www.espn.com.br/futebol/time/_/id/3445/fluminense";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});

document.getElementById('fluminenseBtn').addEventListener('click', function(e) {
window.location.href = fluminenseUrl;
});

document.getElementById('fluminenseText').addEventListener('click', function(e) {
window.location.href = "https://www.fluminense.com.br/site/";
});

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
