<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasileirão Série A</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1f45">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brasileirão">
  
  <!-- Ícones -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1f45;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 230px;
      height: 230px;
      margin-bottom: 2rem;
      border-radius: 24px;
    }

    h1 {
      color: white;
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: rgba(255,255,255,0.7);
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background: #ffffff;
      color: #1a1f45;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1rem;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .fluminense-logo {
      width: 80px;
      height: 80px;
      margin-top: 2rem;
      cursor: pointer;
      transition: transform 0.2s;
      border-radius: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .fluminense-logo:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="Brasileirão" class="logo">
    <h1>Classificação 2026</h1>
    <p>Campeonatos, jogos e resultados</p>
    <a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
    
    <img src="fluminense.png" alt="Fluminense" class="fluminense-logo" id="fluminenseBtn">
  </div>

  <script>
    const googleUrl = "https://www.espn.com.br/futebol/classificacao";
    const fluminenseUrl = "https://www.espn.com.br/futebol/time/_/id/3445/fluminense";
    
    document.getElementById('verBtn').addEventListener('click', function(e) {
      window.location.href = googleUrl;
    });

    document.getElementById('fluminenseBtn').addEventListener('click', function(e) {
      window.location.href = fluminenseUrl;
    });

    // Service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
