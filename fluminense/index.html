<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;       /* ← adicionar */
touch-action: none;     /* ← adicionar */
}

.card {
text-align: center;
padding: 0.1rem 2rem 2rem 2rem;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

/* NOVAS CLASSES PARA OS LOGOS LADO A LADO */
.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: flex-start;
margin-top: 2rem;
}

.time-wrapper {
display: flex;
flex-direction: column;
align-items: center;
gap: 6px;
}

.placar {
font-size: 0.65rem;
color: rgba(255,255,255,0.85);
background: rgba(255,255,255,0.1);
border-radius: 8px;
padding: 3px 7px;
min-width: 64px;
text-align: center;
line-height: 1.3;
white-space: pre-line;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

.time-logo:active {
}
/* FIM DAS NOVAS CLASSES */

</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br><br>

<!-- MUDANÇA AQUI: TRÊS LOGOS LADO A LADO -->
<div class="logos-container">
<div class="time-wrapper">
  <img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
  <div class="placar" id="placar-flu">⏳</div>
</div>
<div class="time-wrapper">
  <img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
  <div class="placar" id="placar-bra">⏳</div>
</div>

</div>
<!-- FIM DA MUDANÇA -->

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});
// ── Placares ao vivo / próximo jogo ──
const API_TOKEN = "097a10c756d8414bab6f4d152de93b41";
const API_BASE  = "https://api.football-data.org/v4";

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})
       + '\n' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

async function fetchTeamStatus(teamId, elId) {
  const el = document.getElementById(elId);
  try {
    // Tenta jogo ao vivo primeiro
    const liveRes = await fetch(`${API_BASE}/teams/${teamId}/matches?status=IN_PLAY,PAUSED,HALFTIME&limit=1`, {headers:{'X-Auth-Token':API_TOKEN}});
    const liveData = await liveRes.json();
    if (liveData.matches && liveData.matches.length > 0) {
      const m = liveData.matches[0];
      const hs = m.score.fullTime.home ?? m.score.halfTime.home ?? '-';
      const as = m.score.fullTime.away ?? m.score.halfTime.away ?? '-';
      el.textContent = `🔴 AO VIVO\n${m.homeTeam.shortName} ${hs}×${as} ${m.awayTeam.shortName}`;
      return;
    }
    // Próximo jogo agendado
    const nxtRes = await fetch(`${API_BASE}/teams/${teamId}/matches?status=SCHEDULED,TIMED&limit=1`, {headers:{'X-Auth-Token':API_TOKEN}});
    const nxtData = await nxtRes.json();
    if (nxtData.matches && nxtData.matches.length > 0) {
      const m = nxtData.matches[0];
      el.textContent = `📅 ${fmtDate(m.utcDate)}\n${m.homeTeam.shortName} × ${m.awayTeam.shortName}`;
      return;
    }
    el.textContent = '—';
  } catch(e) {
    el.textContent = '—';
  }
}

// Fluminense ID: 1966 | Brasil (seleção) ID: 764
fetchTeamStatus(1966, 'placar-flu');
fetchTeamStatus(764,  'placar-bra');

// Bloqueia scroll por toque
document.addEventListener('touchmove', function(e) {
e.preventDefault();
}, { passive: false });

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
