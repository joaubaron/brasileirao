<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão Série A</title>

<!-- PWA -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
}

.card {
text-align: center;
padding: 2rem;
}

.logo {
width: 230px;
height: 230px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

/* NOVAS CLASSES PARA OS LOGOS LADO A LADO */
.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
}

.time-logo {
width: 120px;
height: 120px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 145px;
height: 145px;
}

.time-logo:active {
}
/* FIM DAS NOVAS CLASSES */

</style>
</head>
<body>
<div class="card">
<img src="../icon-512.png" alt="Brasileirão" class="logo">
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br>

<!-- MUDANÇA AQUI: DOIS LOGOS LADO A LADO -->
<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
</div>
<!-- FIM DA MUDANÇA -->

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});

document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});

document.getElementById('meutimeText').addEventListener('click', function(e) {
window.location.href = "https://www.espn.com.br/futebol/time/_/id/3445/fluminense";
});

document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
