<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
touch-action: none;
}

.card {
text-align: center;
padding: 0.1rem 1rem 2rem 1rem;
max-width: 600px;
width: 100%;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
flex-wrap: wrap;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 82px;
height: 78px;
position: relative;
bottom: 1px;
}

.placar-central {
display: flex;
justify-content: center;
margin-top: 20px;
width: 100%;
}

.placar-card {
background: transparent;
border-radius: 16px;
padding: 12px;
width: 280px;
text-align: center;
border: 1px solid rgba(255,255,255,0.3);
}

.placar-titulo {
color: white;
font-size: 0.9rem;
font-weight: bold;
margin-bottom: 8px;
border-bottom: 1px solid rgba(255,255,255,0.3);
padding-bottom: 4px;
display: flex;
align-items: center;
justify-content: center;
}

.placar-status {
font-size: 0.7rem;
font-weight: bold;
margin-bottom: 8px;
}

.placar-status.ao-vivo {
color: #ff4444;
}

.placar-status.sem-jogo {
color: #ffaa44;
}

.placar-jogo {
color: white;
font-size: 1rem;
font-weight: bold;
margin: 8px 0;
}

.placar-info {
color: rgba(255,255,255,0.8);
font-size: 0.7rem;
line-height: 1.4;
}

.proximo-jogo {
color: #4caf50;
font-size: 0.7rem;
margin-top: 6px;
}

.loading {
color: rgba(255,255,255,0.6);
font-size: 0.7rem;
padding: 10px;
}

/* === TIMES EM LINHAS SEPARADAS === */
.placar-times {
display: flex;
flex-direction: column;
align-items: center;
gap: 2px;
font-weight: bold;
color: white;
font-size: 0.85rem;
line-height: 1.3;
margin: 6px 0;
}
.placar-x {
font-size: 0.7rem;
color: rgba(255,255,255,0.6);
font-weight: normal;
}

/* === PULL-TO-REFRESH === */
#ptr-bar {
position: fixed;
top: 0; left: 0; right: 0;
height: 0;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
background: rgba(255,255,255,0.12);
color: white;
font-size: 13px;
font-weight: bold;
transition: height 0.2s ease;
z-index: 999;
backdrop-filter: blur(4px);
}
#ptr-bar.show { height: 48px; }
#ptr-arrow {
display: inline-block;
font-size: 18px;
transition: transform 0.25s ease;
line-height: 1;
}
#ptr-arrow.flip { transform: rotate(180deg); }
#ptr-spinner {
width: 18px; height: 18px;
border: 2px solid rgba(255,255,255,0.3);
border-top-color: white;
border-radius: 50%;
animation: ptr-spin 0.7s linear infinite;
display: none;
}
@keyframes ptr-spin { to { transform: rotate(360deg); } }
#ptr-bar.loading #ptr-spinner { display: block; }
#ptr-bar.loading #ptr-arrow { display: none; }
</style>
</head>
<body>

<!-- PULL-TO-REFRESH BAR -->
<div id="ptr-bar">
<span id="ptr-arrow">↓</span>
<div id="ptr-spinner"></div>
<span id="ptr-label">Puxe para atualizar</span>
</div>

<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<a href="#" class="btn" id="verBtn">Campeonatos, jogos e resultados ⚽</a>
<br>
<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>

<div class="placar-central">
<div class="placar-card" id="placarFluminense">
<div class="placar-titulo">FLUMINENSE</div>
<div class="loading">⏳ Carregando dados reais...</div>
</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

const WORKER_URL = "https://rapid-pine-1fe3.jabaron.workers.dev";
const TIME_FLUMINENSE_ID = 1783;

async function buscarJogoFluminenseReal() {
try {
const response = await fetch(`${WORKER_URL}/fluminense`, { cache: "no-store" });
const data = await response.json();

if (!data.matches || data.matches.length === 0) return { temJogo: false };

const ehFluminense = (nome) => nome && nome.toLowerCase().includes("fluminense");
const jogosFluminense = data.matches.filter(
(m) => ehFluminense(m.homeTeam?.name) || ehFluminense(m.awayTeam?.name)
);

if (jogosFluminense.length === 0) return { temJogo: false };

const jogoAoVivo = jogosFluminense.find((m) =>
["LIVE", "IN_PLAY", "PAUSED"].includes(m.status)
);

if (jogoAoVivo) {
const golsCasa = jogoAoVivo.score?.fullTime?.home ?? jogoAoVivo.score?.halfTime?.home ?? 0;
const golsFora = jogoAoVivo.score?.fullTime?.away ?? jogoAoVivo.score?.halfTime?.away ?? 0;
let tempo = jogoAoVivo.status === "PAUSED" ? "⏸️ Intervalo"
: jogoAoVivo.minute ? `${jogoAoVivo.minute}'` : "Em andamento";
return {
temJogo: true, aoVivo: true,
mandante: jogoAoVivo.homeTeam?.name,
visitante: jogoAoVivo.awayTeam?.name,
golsMandante: golsCasa, golsVisitante: golsFora,
tempo, competicao: jogoAoVivo.competition?.name || "",
};
}

const agora = new Date();
const proximo = jogosFluminense
.filter((m) => ["SCHEDULED", "TIMED"].includes(m.status))
.map((m) => ({ ...m, dataObj: new Date(m.utcDate) }))
.filter((m) => m.dataObj > agora)
.sort((a, b) => a.dataObj - b.dataObj)[0];

if (proximo) {
const d = proximo.dataObj;
const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const hora = `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
const ehMandante = ehFluminense(proximo.homeTeam?.name);
const adversario = ehMandante ? proximo.awayTeam?.name : proximo.homeTeam?.name;

// NOVA LINHA: data e hora juntas
const dataHora = `${d.getDate()} de ${meses[d.getMonth()]} • ${dias[d.getDay()]} • ${hora}`;

return {
temJogo: true, aoVivo: false,
proximo: ehMandante ? `Fluminense x ${adversario}` : `${adversario} x Fluminense`,
dataHora: dataHora,  // ← novo campo
// local: proximo.venue || "Estádio",  // ← REMOVA esta linha
competicao: proximo.competition?.name || "",
};
}

if (data.ultimo) {
const u = data.ultimo;
const ehMandante = ehFluminense(u.homeTeam?.name);
const adversario = ehMandante ? u.awayTeam?.name : u.homeTeam?.name;
const golsFlu = ehMandante ? u.score?.fullTime?.home : u.score?.fullTime?.away;
const golsAdv = ehMandante ? u.score?.fullTime?.away : u.score?.fullTime?.home;
const d = new Date(u.utcDate);
const dias = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const hora = `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;

// Data formatada igual ao próximo jogo
const dataHora = `${d.getDate()} de ${meses[d.getMonth()]} • ${dias[d.getDay()]} • ${hora}`;

return {
temJogo: true, aoVivo: false, encerrado: true,
proximo: ehMandante
? `Fluminense ${golsFlu} x ${golsAdv} ${adversario}`
: `${adversario} ${golsAdv} x ${golsFlu} Fluminense`,
dataHora: dataHora,  // ← novo campo igual ao próximo jogo
competicao: u.competition?.name || "",
};
}

return { temJogo: false };
} catch (error) {
console.error("Erro:", error);
return { temJogo: false, erro: true };
}
}

function atualizarPlacarFluminense(dados) {
const container = document.getElementById('placarFluminense');
if (!container) return;

if (dados.erro) {
container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="placar-status sem-jogo">⚠️ Erro ao carregar</div>
<div class="placar-info">Tente novamente</div>`;
return;
}

// Helper para montar as duas linhas (time / x / time)
function formatTwoLines(mandante, visitante, golsM = null, golsV = null) {
const mandanteDisplay = golsM !== null ? `${mandante} ${golsM}` : mandante;
const visitanteDisplay = golsV !== null ? `${visitante} ${golsV}` : visitante;
return `
<div class="placar-times">
<span>${mandanteDisplay}</span>
<span class="placar-x">x</span>
<span>${visitanteDisplay}</span>
</div>
`;
}

// Caso 1: JOGO AO VIVO
if (dados.temJogo && dados.aoVivo) {
const golsM = dados.golsMandante;
const golsV = dados.golsVisitante;
const duasLinhas = formatTwoLines(dados.mandante, dados.visitante, golsM, golsV);

container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="placar-status ao-vivo">🟢 AO VIVO</div>
${duasLinhas}
<div class="placar-info">${dados.tempo}</div>
<div class="placar-info" style="font-size:0.65rem">🏆 ${dados.competicao}</div>`;
}
// Caso 2: JOGO ENCERRADO
else if (dados.temJogo && dados.encerrado) {
const partes = dados.proximo.split(' x ');
let mandanteDisplay = partes[0];
let visitanteDisplay = partes[1];

container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="placar-status sem-jogo" style="color:#aaaaaa">✅ ENCERRADO</div>
<div class="placar-times">
<span>${mandanteDisplay}</span>
<span class="placar-x">x</span>
<span>${visitanteDisplay}</span>
</div>
<div class="placar-info">${dados.dataHora}</div>
<div class="placar-info" style="font-size:0.65rem">🏆 ${dados.competicao}</div>`;
}
// Caso 3: PRÓXIMO JOGO
else if (dados.temJogo && !dados.aoVivo && !dados.encerrado) {
const partes = dados.proximo.split(' x ');
const linhaJogo = partes.length === 2
? `<div class="placar-times">
<span>${partes[0]}</span>
<span class="placar-x">x</span>
<span>${partes[1]}</span>
</div>`
: `<div class="placar-info" style="font-weight:bold">${dados.proximo}</div>`;

container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="placar-status sem-jogo" style="color:#4caf50">⚽ PRÓXIMO JOGO</div>
${linhaJogo}
<div class="placar-info">${dados.dataHora}</div>
<div class="placar-info" style="font-size:0.65rem;margin-top:4px">🏆 ${dados.competicao}</div>`;
}
// Caso 4: SEM JOGO PROGRAMADO
else {
container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="placar-status sem-jogo">📅 Nenhum jogo programado</div>
<div class="placar-info">Verifique calendário oficial</div>`;
}
}

let primeiraVez = true;
let ultimoEncerrado = null;       // { dados, expiresAt }

async function carregarPlacares() {
if (primeiraVez) {
const container = document.getElementById('placarFluminense');
container.innerHTML = `
<div class="placar-titulo">FLUMINENSE</div>
<div class="loading">⏳ Buscando dados...</div>`;
}
let fluminense = await buscarJogoFluminenseReal();

// Se veio jogo encerrado, guarda com expiração de 30 min
if (fluminense.temJogo && fluminense.encerrado) {
ultimoEncerrado = { dados: fluminense, expiresAt: Date.now() + 30 * 60 * 1000 };
}

// Se não tem jogo ao vivo/agendado mas ainda está no prazo, mostra o encerrado
if (!fluminense.temJogo && ultimoEncerrado && Date.now() < ultimoEncerrado.expiresAt) {
fluminense = ultimoEncerrado.dados;
} else if (ultimoEncerrado && Date.now() >= ultimoEncerrado.expiresAt) {
ultimoEncerrado = null;
}

atualizarPlacarFluminense(fluminense);
primeiraVez = false;
}

// === PULL-TO-REFRESH ===
(function () {
const THRESHOLD = 65;
let startY = 0, pulling = false, triggered = false;
const bar   = document.getElementById('ptr-bar');
const arrow = document.getElementById('ptr-arrow');
const label = document.getElementById('ptr-label');

function reset() {
bar.classList.remove('show', 'loading');
arrow.classList.remove('flip');
label.textContent = 'Puxe para atualizar';
triggered = false;
}

async function doRefresh() {
bar.classList.add('show', 'loading');
label.textContent = 'Atualizando...';
await carregarPlacares();
reset();
}

document.addEventListener('touchstart', (e) => {
startY = e.touches[0].clientY;
pulling = true;
triggered = false;
}, { passive: true });

document.addEventListener('touchmove', (e) => {
if (!pulling) return;
const dy = e.touches[0].clientY - startY;
if (dy > 10) {
e.preventDefault();           // bloqueia scroll só quando está puxando pra baixo
bar.classList.add('show');
if (dy >= THRESHOLD) {
arrow.classList.add('flip');
label.textContent = 'Solte para atualizar';
triggered = true;
} else {
arrow.classList.remove('flip');
label.textContent = 'Puxe para atualizar';
triggered = false;
}
}
}, { passive: false });

document.addEventListener('touchend', () => {
if (!pulling) return;
pulling = false;
if (triggered) {
doRefresh();
} else {
reset();
}
}, { passive: true });
})();
// === FIM PULL-TO-REFRESH ===

// Eventos dos botões
document.getElementById('verBtn').addEventListener('click', function() {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function() {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function() {
window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function() {
window.location.href = "https://www.becsaf.com.br/";
});

// Carrega os dados
carregarPlacares();
setInterval(carregarPlacares, 30000);

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
