<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;       /* ← adicionar */
touch-action: none;     /* ← adicionar */
}

.card {
text-align: center;
padding: 0.1rem 2rem 2rem 2rem;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

/* NOVAS CLASSES PARA OS LOGOS LADO A LADO */
.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

.time-logo:active {
}
/* FIM DAS NOVAS CLASSES */


.placares-linha {
display: flex;
gap: 12px;
justify-content: center;
margin-top: 14px;
}
.placar-badge {
flex: 1;
max-width: 140px;
font-size: 0.7rem;
color: rgba(255,255,255,0.9);
background: rgba(255,255,255,0.1);
border-radius: 10px;
padding: 6px 10px;
text-align: center;
white-space: pre-line;
line-height: 1.4;
min-height: 36px;
display: flex;
align-items: center;
justify-content: center;
}
</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<p style="color: white; font-size: 14px; font-weight: 500; cursor:pointer;" id="verBtn">⚽ Campeonatos, jogos e resultados</p>
<!-- MUDANÇA AQUI: TRÊS LOGOS LADO A LADO -->
<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>
<!-- FIM DA MUDANÇA -->
<div class="placares-linha">
  <div class="placar-badge" id="placar-flu">⏳ Fluminense</div>
  <div class="placar-badge" id="placar-bra">⏳ Brasil</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
window.location.href = "https://www.becsaf.com.br/";
});

// Bloqueia scroll por toque
document.addEventListener('touchmove', function(e) {
e.preventDefault();
}, { passive: false });

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}

// ── Placares Fluminense e Brasil ──
const _TOKEN = '097a10c756d8414bab6f4d152de93b41';
const _BASE  = 'https://api.football-data.org/v4';
const _PROXY = 'https://corsproxy.io/?url=';

async function _fetchAPI(endpoint) {
  const url = _BASE + endpoint;
  const proxies = [
    'https://corsproxy.io/?url=' + encodeURIComponent(url),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  ];
  for (const proxy of proxies) {
    try {
      const r = await fetch(proxy, {headers:{'X-Auth-Token':_TOKEN}});
      if (r.ok) return await r.json();
    } catch(e) {}
  }
  return null;
}

async function _placar(teamId, elId, fallback) {
  const el = document.getElementById(elId);
  const live = await _fetchAPI('/matches?status=LIVE');
  if (live && live.matches) {
    const m = live.matches.find(x => x.homeTeam?.id===teamId || x.awayTeam?.id===teamId);
    if (m) {
      const home = m.score?.fullTime?.home ?? m.score?.halfTime?.home ?? 0;
      const away = m.score?.fullTime?.away ?? m.score?.halfTime?.away ?? 0;
      el.textContent = '🔴 AO VIVO
' + m.homeTeam.shortName + ' ' + home + 'x' + away + ' ' + m.awayTeam.shortName;
      return;
    }
  }
  // Próximo agendado (SCHEDULED ou TIMED)
  for (const status of ['SCHEDULED', 'TIMED']) {
    const nxt = await _fetchAPI('/teams/' + teamId + '/matches?status=' + status + '&limit=5');
    if (nxt && nxt.matches && nxt.matches.length) {
      const fut = nxt.matches.filter(x => new Date(x.utcDate) > new Date()).sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
      if (fut.length) {
        const m = fut[0];
        const d = new Date(m.utcDate);
        const h = d.getUTCHours()-3; const ha = h<0?h+24:h;
        const min = d.getUTCMinutes().toString().padStart(2,'0');
        el.textContent = '📅 ' + d.getUTCDate()+'/'+(d.getUTCMonth()+1)+' '+ha+'h'+min+'\n'+m.homeTeam.shortName+' × '+m.awayTeam.shortName;
        return;
      }
    }
  }
  // Último jogo finalizado como fallback
  const last = await _fetchAPI('/teams/' + teamId + '/matches?status=FINISHED&limit=1');
  if (last && last.matches && last.matches.length) {
    const m = last.matches[last.matches.length-1];
    const home = m.score?.fullTime?.home ?? 0;
    const away = m.score?.fullTime?.away ?? 0;
    el.textContent = '✅ ' + m.homeTeam.shortName + ' ' + home + 'x' + away + ' ' + m.awayTeam.shortName;
    return;
  }
  el.textContent = fallback;
}

_placar(1773, 'placar-flu', '🟢 FLU');
_placar(764,  'placar-bra', '🇧🇷 BRA');
setInterval(() => {
  _placar(1773, 'placar-flu', '🟢 FLU');
  _placar(764,  'placar-bra', '🇧🇷 BRA');
}, 30000);
</script>
</body>
</html>
