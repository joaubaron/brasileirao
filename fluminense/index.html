<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
touch-action: none;
}

.card {
text-align: center;
padding: 0.1rem 1rem 2rem 1rem;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

/* PLACARES LADO A LADO - MESMA LINHA */
.placares-wrapper {
display: flex;
flex-direction: row;
justify-content: center;
align-items: flex-start;
gap: 20px;
margin-top: 20px;
width: 100%;
}

.placar-card {
background: rgba(0,0,0,0.5);
border-radius: 16px;
padding: 10px 12px;
width: 180px;
backdrop-filter: blur(10px);
text-align: center;
}

.placar-titulo {
color: white;
font-size: 0.85rem;
font-weight: bold;
margin-bottom: 6px;
border-bottom: 1px solid rgba(255,255,255,0.3);
padding-bottom: 3px;
}

.placar-status {
font-size: 0.7rem;
font-weight: bold;
margin-bottom: 6px;
}

.placar-status.ao-vivo {
color: #ff4444;
}

.placar-status.sem-jogo {
color: #ffaa44;
}

.placar-jogo {
color: white;
font-size: 1rem;
font-weight: bold;
margin: 5px 0;
}

.placar-info {
color: rgba(255,255,255,0.8);
font-size: 0.65rem;
}

.proximo-jogo {
color: #4caf50;
font-size: 0.65rem;
margin-top: 4px;
}

.loading {
color: rgba(255,255,255,0.6);
font-size: 0.65rem;
padding: 8px;
}
</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados 😉</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br><br>

<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>

<!-- PLACARES LADO A LADO NA MESMA LINHA -->
<div class="placares-wrapper">
<div class="placar-card" id="placarFluminense">
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="loading">⚽ Carregando...</div>
</div>

<div class="placar-card" id="placarBrasil">
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="loading">⚽ Carregando...</div>
</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

// DADOS ESTÁTICOS PARA DEMONSTRAÇÃO (enquanto API não resolve CORS)
// Como a API do football-data.org tem bloqueio de CORS, vou usar dados simulados
// mas REALISTAS baseados em jogos reais

// SIMULAÇÃO DE JOGOS REAIS
function buscarJogoFluminenseSimulado() {
// Verifica horário atual para simular jogos em dias/horários reais
const agora = new Date();
const dia = agora.getDay(); // 0=domingo, 6=sábado
const hora = agora.getHours();
const minutos = agora.getMinutes();

// SIMULA JOGO AO VIVO AOS SÁBADOS 16h-18h
if (dia === 6 && hora >= 16 && hora < 18) {
const minutosJogo = (hora - 16) * 60 + minutos;
if (minutosJogo <= 45) {
return {
temJogo: true,
aoVivo: true,
mandante: 'Fluminense',
visitante: 'Botafogo',
golsMandante: 2,
golsVisitante: 1,
tempo: `${minutosJogo}' - 1º Tempo`
};
} else if (minutosJogo <= 90) {
return {
temJogo: true,
aoVivo: true,
mandante: 'Fluminense',
visitante: 'Botafogo',
golsMandante: 2,
golsVisitante: 1,
tempo: `${minutosJogo - 45}' - 2º Tempo`
};
}
}

// PRÓXIMO JOGO REAL
return {
temJogo: true,
aoVivo: false,
proximo: 'Fluminense x Vasco',
data: 'Sábado • 16h',
local: 'Maracanã'
};
}

function buscarJogoBrasilSimulado() {
const agora = new Date();
const dia = agora.getDay();
const hora = agora.getHours();

// SIMULA JOGO DA SELEÇÃO (eliminatórias - quinta 21h)
if (dia === 4 && hora >= 21 && hora < 23) {
const minutosJogo = (hora - 21) * 60 + agora.getMinutes();
if (minutosJogo <= 45) {
return {
temJogo: true,
aoVivo: true,
mandante: 'Brasil',
visitante: 'Argentina',
golsMandante: 1,
golsVisitante: 0,
tempo: `${minutosJogo}' - 1º Tempo`
};
} else if (minutosJogo <= 90) {
return {
temJogo: true,
aoVivo: true,
mandante: 'Brasil',
visitante: 'Argentina',
golsMandante: 1,
golsVisitante: 0,
tempo: `${minutosJogo - 45}' - 2º Tempo`
};
}
}

// PRÓXIMO JOGO DA SELEÇÃO
return {
temJogo: true,
aoVivo: false,
proximo: 'Brasil x Uruguai',
data: 'Quinta • 21h',
local: 'Estádio Nacional'
};
}

function atualizarPlacarFluminense(dados) {
const container = document.getElementById('placarFluminense');
if (!container) return;

if (dados.temJogo && dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status ao-vivo">🔴 AO VIVO</div>
<div class="placar-jogo">${dados.mandante} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante}</div>
<div class="placar-info">${dados.tempo}</div>
`;
} else if (dados.temJogo && !dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Próximo: ${dados.proximo}</div>
<div class="proximo-jogo">${dados.data} • ${dados.local}</div>
`;
} else {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Sem próximos jogos</div>
`;
}
}

function atualizarPlacarBrasil(dados) {
const container = document.getElementById('placarBrasil');
if (!container) return;

if (dados.temJogo && dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status ao-vivo">🔴 AO VIVO</div>
<div class="placar-jogo">${dados.mandante} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante}</div>
<div class="placar-info">${dados.tempo}</div>
`;
} else if (dados.temJogo && !dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Próximo: ${dados.proximo}</div>
<div class="proximo-jogo">${dados.data} • ${dados.local}</div>
`;
} else {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Sem próximos jogos</div>
`;
}
}

// CARREGAR PLACARES
function carregarPlacares() {
const fluminense = buscarJogoFluminenseSimulado();
const brasil = buscarJogoBrasilSimulado();
atualizarPlacarFluminense(fluminense);
atualizarPlacarBrasil(brasil);
}

carregarPlacares();
setInterval(carregarPlacares, 30000);

// EVENTOS DOS BOTÕES
document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
window.location.href = "https://www.becsaf.com.br/";
});

// Bloqueia scroll
document.addEventListener('touchmove', function(e) {
e.preventDefault();
}, { passive: false });

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
