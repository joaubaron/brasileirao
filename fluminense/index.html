<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow-y: auto;
touch-action: pan-y;
}

.card {
text-align: center;
padding: 0.1rem 1rem 2rem 1rem;
max-width: 600px;
width: 100%;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
flex-wrap: wrap;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

.placar-central {
display: flex;
justify-content: center;
margin-top: 20px;
width: 100%;
}

.placar-card {
background: rgba(0,0,0,0.6);
border-radius: 16px;
padding: 12px;
width: 240px;
backdrop-filter: blur(10px);
text-align: center;
border: 1px solid rgba(255,255,255,0.1);
}

.placar-titulo {
color: white;
font-size: 0.9rem;
font-weight: bold;
margin-bottom: 8px;
border-bottom: 1px solid rgba(255,255,255,0.3);
padding-bottom: 4px;
}

.placar-status {
font-size: 0.7rem;
font-weight: bold;
margin-bottom: 8px;
}

.placar-status.ao-vivo {
color: #ff4444;
}

.placar-status.sem-jogo {
color: #ffaa44;
}

.placar-jogo {
color: white;
font-size: 1rem;
font-weight: bold;
margin: 8px 0;
}

.placar-info {
color: rgba(255,255,255,0.8);
font-size: 0.7rem;
line-height: 1.4;
}

.proximo-jogo {
color: #4caf50;
font-size: 0.7rem;
margin-top: 6px;
}

.loading {
color: rgba(255,255,255,0.6);
font-size: 0.7rem;
padding: 10px;
}
</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<a href="#" class="btn" id="verBtn">Campeonatos, jogos e resultados ⚽</a>
<br>
<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>

<div class="placar-central">
<div class="placar-card" id="placarFluminense">
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="loading">⏳ Carregando dados reais...</div>
</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

// SEU WORKER URL - SUBSTITUA PELA SUA URL DO CLOUDFLARE WORKER
const WORKER_URL = "https://rapid-pine-1fe3.jabaron.workers.dev";
const TIME_FLUMINENSE_ID = 1783;

async function buscarJogoFluminenseReal() {
    try {
        // Busca jogos do Fluminense via Worker (sem CORS)
        const url = `${WORKER_URL}/teams/${TIME_FLUMINENSE_ID}/matches?status=LIVE,IN_PLAY,PAUSED,SCHEDULED&limit=10`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.matches || data.matches.length === 0) {
            return { temJogo: false };
        }
        
        // Procura jogo AO VIVO
        const jogoAoVivo = data.matches.find(m => 
            m.status === 'LIVE' || m.status === 'IN_PLAY' || m.status === 'PAUSED'
        );
        
        if (jogoAoVivo) {
            const golsHome = jogoAoVivo.score?.fullTime?.home ?? jogoAoVivo.score?.halfTime?.home ?? 0;
            const golsAway = jogoAoVivo.score?.fullTime?.away ?? jogoAoVivo.score?.halfTime?.away ?? 0;
            
            let tempo = '';
            if (jogoAoVivo.status === 'LIVE' || jogoAoVivo.status === 'IN_PLAY') {
                tempo = `${jogoAoVivo.minute || 0}' - 2º Tempo`;
            } else if (jogoAoVivo.status === 'PAUSED') {
                tempo = '⏸️ Intervalo';
            }
            
            return {
                temJogo: true,
                aoVivo: true,
                mandante: jogoAoVivo.homeTeam?.name || 'Fluminense',
                visitante: jogoAoVivo.awayTeam?.name || 'Adversário',
                golsMandante: golsHome,
                golsVisitante: golsAway,
                tempo: tempo,
                competicao: jogoAoVivo.competition?.name || ''
            };
        }
        
        // Próximo jogo
        const agora = new Date();
        const proximosJogos = data.matches
            .filter(m => m.status === 'SCHEDULED' || m.status === 'TIMED')
            .map(m => ({ ...m, dataObj: new Date(m.utcDate) }))
            .filter(m => m.dataObj > agora)
            .sort((a, b) => a.dataObj - b.dataObj);
        
        if (proximosJogos.length > 0) {
            const proximo = proximosJogos[0];
            const dataJogo = proximo.dataObj;
            const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            
            const diaSemana = dias[dataJogo.getDay()];
            const diaMes = dataJogo.getDate();
            const mes = meses[dataJogo.getMonth()];
            const hora = dataJogo.getHours().toString().padStart(2, '0');
            const minuto = dataJogo.getMinutes().toString().padStart(2, '0');
            
            return {
                temJogo: true,
                aoVivo: false,
                proximo: `${proximo.homeTeam?.name || 'Time'} x ${proximo.awayTeam?.name || 'Adversário'}`,
                data: `${diaSemana} • ${hora}:${minuto}`,
                dataCompleta: `${diaMes} de ${mes}`,
                local: proximo.venue || 'Estádio',
                competicao: proximo.competition?.name || ''
            };
        }
        
        return { temJogo: false };
        
    } catch (error) {
        console.error('Erro:', error);
        return { temJogo: false, erro: true };
    }
}

function atualizarPlacarFluminense(dados) {
    const container = document.getElementById('placarFluminense');
    if (!container) return;
    
    if (dados.erro) {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status sem-jogo">⚠️ Erro ao carregar</div>
            <div class="placar-info">Tente novamente</div>
        `;
        return;
    }
    
    if (dados.temJogo && dados.aoVivo) {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status ao-vivo">🔴 AO VIVO</div>
            <div class="placar-jogo">${dados.mandante} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante}</div>
            <div class="placar-info">${dados.tempo}</div>
            <div class="placar-info" style="font-size:0.65rem">🏆 ${dados.competicao}</div>
        `;
    } else if (dados.temJogo && !dados.aoVivo) {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
            <div class="placar-info" style="font-weight:bold">Próximo: ${dados.proximo}</div>
            <div class="placar-info">${dados.dataCompleta}</div>
            <div class="proximo-jogo">${dados.data} • ${dados.local}</div>
            <div class="placar-info" style="font-size:0.65rem;margin-top:4px">🏆 ${dados.competicao}</div>
        `;
    } else {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo programado</div>
            <div class="placar-info">Verifique calendário oficial</div>
        `;
    }
}

async function carregarPlacares() {
    const container = document.getElementById('placarFluminense');
    container.innerHTML = `
        <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
        <div class="loading">⏳ Buscando dados reais da API...</div>
    `;
    
    const fluminense = await buscarJogoFluminenseReal();
    atualizarPlacarFluminense(fluminense);
}

// Eventos dos botões
document.getElementById('verBtn').addEventListener('click', function(e) {
    window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
    window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
    window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
    window.location.href = "https://www.becsaf.com.br/";
});

// Carrega os dados
carregarPlacares();
setInterval(carregarPlacares, 30000);

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
