<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
touch-action: none;
}

.card {
text-align: center;
padding: 0.1rem 2rem 2rem 2rem;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

/* NOVOS ESTILOS PARA OS PLACARES LADO A LADO */
.placares-container {
display: flex;
gap: 30px;
justify-content: center;
align-items: flex-start;
margin-top: 1.5rem;
flex-wrap: wrap;
}

.placar-card {
background: rgba(0,0,0,0.5);
border-radius: 16px;
padding: 12px 16px;
min-width: 200px;
backdrop-filter: blur(10px);
text-align: center;
}

.placar-titulo {
color: white;
font-size: 0.9rem;
font-weight: bold;
margin-bottom: 8px;
border-bottom: 1px solid rgba(255,255,255,0.3);
padding-bottom: 4px;
}

.placar-status {
font-size: 0.75rem;
font-weight: bold;
margin-bottom: 8px;
}

.placar-status.ao-vivo {
color: #ff4444;
}

.placar-status.sem-jogo {
color: #ffaa44;
}

.placar-jogo {
color: white;
font-size: 1.3rem;
font-weight: bold;
margin: 8px 0;
}

.placar-info {
color: rgba(255,255,255,0.8);
font-size: 0.7rem;
}

.proximo-jogo {
color: #4caf50;
font-size: 0.7rem;
margin-top: 6px;
}

.loading {
color: rgba(255,255,255,0.6);
font-size: 0.7rem;
padding: 10px;
}
</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<a href="#" class="btn" id="verBtn">Campeonatos, jogos e resultados ⚽</a>
<br><br>

<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>

<!-- PLACARES LADO A LADO -->
<div class="placares-container">
<div class="placar-card" id="placarFluminense">
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="loading">Carregando...</div>
</div>

<div class="placar-card" id="placarBrasil">
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="loading">Carregando...</div>
</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";
const API_TOKEN = "097a10c756d8414bab6f4d152de93b41";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
window.location.href = "https://www.becsaf.com.br/";
});

// Bloqueia scroll por toque
document.addEventListener('touchmove', function(e) {
e.preventDefault();
}, { passive: false });

// FUNÇÃO PARA BUSCAR JOGOS DO FLUMINENSE (TIMES BRASILEIROS)
async function buscarJogoFluminense() {
const timeId = 1783; // ID do Fluminense na API
const url = `https://api.football-data.org/v4/teams/${timeId}/matches?status=LIVE,IN_PLAY,PAUSED,SCHEDULED&limit=5`;

try {
const response = await fetch(url, {
headers: { 'X-Auth-Token': API_TOKEN }
});
const data = await response.json();

// Procura jogo ao vivo primeiro
const jogoAoVivo = data.matches?.find(m => 
m.status === 'LIVE' || m.status === 'IN_PLAY' || m.status === 'PAUSED'
);

if (jogoAoVivo) {
const golsMandante = jogoAoVivo.score?.fullTime?.home ?? jogoAoVivo.score?.halfTime?.home ?? 0;
const golsVisitante = jogoAoVivo.score?.fullTime?.away ?? jogoAoVivo.score?.halfTime?.away ?? 0;
let tempo = '';
if (jogoAoVivo.status === 'LIVE' || jogoAoVivo.status === 'IN_PLAY') {
tempo = `${jogoAoVivo.minute || '0'}' - ${jogoAoVivo.matchday ? `${jogoAoVivo.matchday}ª Rodada` : '2º Tempo'}`;
} else if (jogoAoVivo.status === 'PAUSED') {
tempo = 'Intervalo';
}

return {
temJogo: true,
aoVivo: true,
mandante: jogoAoVivo.homeTeam?.name || 'Fluminense',
visitante: jogoAoVivo.awayTeam?.name || 'Adversário',
golsMandante: golsMandante,
golsVisitante: golsVisitante,
tempo: tempo
};
}

// Se não tem ao vivo, pega próximo jogo
const proximoJogo = data.matches?.find(m => 
m.status === 'SCHEDULED' && new Date(m.utcDate) > new Date()
);

if (proximoJogo) {
const dataJogo = new Date(proximoJogo.utcDate);
const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const diaSemana = diasSemana[dataJogo.getDay()];
const hora = dataJogo.getHours().toString().padStart(2,'0');
const minuto = dataJogo.getMinutes().toString().padStart(2,'0');
const mandante = proximoJogo.homeTeam?.name || 'Fluminense';
const visitante = proximoJogo.awayTeam?.name || 'Adversário';

return {
temJogo: true,
aoVivo: false,
proximo: `${mandante} x ${visitante}`,
data: `${diaSemana} • ${hora}:${minuto}`,
local: 'Maracanã'
};
}

return { temJogo: false };
} catch (error) {
console.error('Erro Fluminense:', error);
return { temJogo: false, erro: true };
}
}

// FUNÇÃO PARA BUSCAR JOGOS DO BRASIL (SELEÇÃO)
async function buscarJogoBrasil() {
const timeId = 764; // ID da Seleção Brasileira
const url = `https://api.football-data.org/v4/teams/${timeId}/matches?status=LIVE,IN_PLAY,PAUSED,SCHEDULED&limit=5`;

try {
const response = await fetch(url, {
headers: { 'X-Auth-Token': API_TOKEN }
});
const data = await response.json();

const jogoAoVivo = data.matches?.find(m => 
m.status === 'LIVE' || m.status === 'IN_PLAY' || m.status === 'PAUSED'
);

if (jogoAoVivo) {
const golsMandante = jogoAoVivo.score?.fullTime?.home ?? jogoAoVivo.score?.halfTime?.home ?? 0;
const golsVisitante = jogoAoVivo.score?.fullTime?.away ?? jogoAoVivo.score?.halfTime?.away ?? 0;
let tempo = '';
if (jogoAoVivo.status === 'LIVE' || jogoAoVivo.status === 'IN_PLAY') {
tempo = `${jogoAoVivo.minute || '0'}' - 2º Tempo`;
} else if (jogoAoVivo.status === 'PAUSED') {
tempo = 'Intervalo';
}

return {
temJogo: true,
aoVivo: true,
mandante: jogoAoVivo.homeTeam?.name || 'Brasil',
visitante: jogoAoVivo.awayTeam?.name || 'Adversário',
golsMandante: golsMandante,
golsVisitante: golsVisitante,
tempo: tempo
};
}

const proximoJogo = data.matches?.find(m => 
m.status === 'SCHEDULED' && new Date(m.utcDate) > new Date()
);

if (proximoJogo) {
const dataJogo = new Date(proximoJogo.utcDate);
const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const diaSemana = diasSemana[dataJogo.getDay()];
const hora = dataJogo.getHours().toString().padStart(2,'0');
const minuto = dataJogo.getMinutes().toString().padStart(2,'0');
const mandante = proximoJogo.homeTeam?.name || 'Brasil';
const visitante = proximoJogo.awayTeam?.name || 'Adversário';

return {
temJogo: true,
aoVivo: false,
proximo: `${mandante} x ${visitante}`,
data: `${diaSemana} • ${hora}:${minuto}`,
local: proximoJogo.venue || 'Estádio'
};
}

return { temJogo: false };
} catch (error) {
console.error('Erro Brasil:', error);
return { temJogo: false, erro: true };
}
}

// FUNÇÃO PARA ATUALIZAR O HTML DOS PLACARES
function atualizarPlacarFluminense(dados) {
const container = document.getElementById('placarFluminense');
if (!container) return;

if (dados.erro) {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status sem-jogo">⚠️ Erro ao carregar</div>
<div class="placar-info">Tente novamente mais tarde</div>
`;
return;
}

if (dados.temJogo && dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status ao-vivo">🔴 AO VIVO</div>
<div class="placar-jogo">${dados.mandante.split(' ')[0]} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante.split(' ')[0]}</div>
<div class="placar-info">${dados.tempo}</div>
`;
} else if (dados.temJogo && !dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Próximo: ${dados.proximo}</div>
<div class="proximo-jogo">${dados.data} • ${dados.local}</div>
`;
} else {
container.innerHTML = `
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Sem próximos jogos programados</div>
`;
}
}

function atualizarPlacarBrasil(dados) {
const container = document.getElementById('placarBrasil');
if (!container) return;

if (dados.erro) {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status sem-jogo">⚠️ Erro ao carregar</div>
<div class="placar-info">Tente novamente mais tarde</div>
`;
return;
}

if (dados.temJogo && dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status ao-vivo">🔴 AO VIVO</div>
<div class="placar-jogo">${dados.mandante.split(' ')[0]} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante.split(' ')[0]}</div>
<div class="placar-info">${dados.tempo}</div>
`;
} else if (dados.temJogo && !dados.aoVivo) {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Próximo: ${dados.proximo}</div>
<div class="proximo-jogo">${dados.data} • ${dados.local}</div>
`;
} else {
container.innerHTML = `
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
<div class="placar-info">Sem próximos jogos programados</div>
`;
}
}

// CARREGAR OS DADOS
async function carregarTodosPlacares() {
const [fluminense, brasil] = await Promise.all([
buscarJogoFluminense(),
buscarJogoBrasil()
]);
atualizarPlacarFluminense(fluminense);
atualizarPlacarBrasil(brasil);
}

// ATUALIZAR A CADA 30 SEGUNDOS SE HOUVER JOGO AO VIVO
carregarTodosPlacares();
setInterval(() => {
carregarTodosPlacares();
}, 30000);

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
