<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;       /* ← adicionar */
touch-action: none;     /* ← adicionar */
}

.card {
text-align: center;
padding: 0.1rem 2rem 2rem 2rem;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

h1 {
color: white;
font-size: 1.2rem;
margin-bottom: 0.5rem;
}

.card p {
color: rgba(255,255,255,0.7);
margin-bottom: 1rem;
}

p {
color: rgba(255,255,255,0.7);
margin-bottom: 2rem;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

/* NOVAS CLASSES PARA OS LOGOS LADO A LADO */
.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

.time-logo:active {
}
/* FIM DAS NOVAS CLASSES */

/* ===== NOVOS ESTILOS DOS PLACARES (APENAS ADICIONADOS, NADA REMOVIDO) ===== */
.placares-duplo {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: stretch;
    margin: 20px 0 10px 0;
    flex-wrap: wrap;
}

.time-placar-card {
    flex: 1;
    min-width: 180px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    padding: 16px 12px;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.2s;
}

.time-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.time-nome {
    font-weight: bold;
    font-size: 1.1rem;
    color: white;
}

.placar-destaque {
    font-size: 2rem;
    font-weight: 800;
    color: #FFE484;
    margin: 8px 0;
    letter-spacing: 2px;
}

.ao-vivo-badge {
    background: #e84118;
    color: white;
    font-weight: bold;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 8px;
}

.partida-status {
    font-size: 0.7rem;
    color: #ffbc6e;
    margin-top: 6px;
}

.nenhum-jogo {
    color: #b9c3ff;
    font-weight: 500;
    font-size: 0.8rem;
    padding: 6px 0;
}

.proximo-jogo {
    font-size: 0.7rem;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.15);
    color: #aab4e6;
    line-height: 1.4;
}
/* ===== FIM DOS ESTILOS DOS PLACARES ===== */

</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br><br>

<!-- MUDANÇA AQUI: TRÊS LOGOS LADO A LADO -->
<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>
<!-- FIM DA MUDANÇA -->

<!-- ===== NOVO: DOIS PLACARES LADO A LADO (FLUMINENSE + BRASIL) ===== -->
<div class="placares-duplo">
    <!-- PLACAR FLUMINENSE -->
    <div class="time-placar-card" id="fluminenseCard">
        <div class="time-header">
            <span class="time-nome">🇭🇺 FLUMINENSE</span>
        </div>
        <div id="fluPlacarContent">
            <div class="nenhum-jogo">⚽ Carregando...</div>
        </div>
    </div>

    <!-- PLACAR BRASIL -->
    <div class="time-placar-card" id="brasilCard">
        <div class="time-header">
            <span class="time-nome">🇧🇷 BRASIL</span>
        </div>
        <div id="brasilPlacarContent">
            <div class="nenhum-jogo">⚽ Carregando...</div>
        </div>
    </div>
</div>
<!-- ===== FIM DOS PLACARES ===== -->

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

document.getElementById('verBtn').addEventListener('click', function(e) {
window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
window.location.href = "https://www.becsaf.com.br/";
});

// Bloqueia scroll por toque
document.addEventListener('touchmove', function(e) {
e.preventDefault();
}, { passive: false });

// Service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('../sw.js');
}

// ===== NOVO CÓDIGO DOS PLACARES COM API FOOTBALL-DATA.ORG =====
// API Token fornecida pelo usuário
const API_TOKEN = '097a10c756d8414bab6f4d152de93b41';
const headers = { 'X-Auth-Token': API_TOKEN };

// IDs dos times pela football-data.org
// Fluminense = 1783 (Brasileirão Série A)
// Seleção Brasileira = 764
const FLU_ID = 1783;
const BRAZIL_ID = 764;

// Função para buscar partidas de um time
async function fetchTeamMatches(teamId) {
    const url = `https://api.football-data.org/v4/teams/${teamId}/matches?limit=12&status=SCHEDULED,LIVE,IN_PLAY,PAUSED,FINISHED`;
    try {
        const response = await fetch(url, { headers });
        if (!response.ok) {
            console.warn(`Erro ${response.status} para time ${teamId}`);
            return null;
        }
        const data = await response.json();
        return data.matches || [];
    } catch (err) {
        console.error("Erro na requisição:", err);
        return null;
    }
}

// Processa os jogos e retorna { live, next }
function processMatches(matches, teamName) {
    if (!matches || matches.length === 0) {
        return { live: null, next: null };
    }
    
    // Procura jogo AO VIVO (LIVE, IN_PLAY, PAUSED)
    const liveMatch = matches.find(m => m.status === 'LIVE' || m.status === 'IN_PLAY' || m.status === 'PAUSED');
    if (liveMatch) {
        return { live: liveMatch, next: null };
    }
    
    // Próximo jogo agendado (SCHEDULED e data futura)
    const now = new Date();
    const upcoming = matches
        .filter(m => m.status === 'SCHEDULED' && new Date(m.utcDate) > now)
        .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
    
    const nextMatch = upcoming.length > 0 ? upcoming[0] : null;
    return { live: null, next: nextMatch };
}

// Renderiza jogo AO VIVO
function renderLiveMatch(match, teamId) {
    // Identifica se o time é mandante ou visitante
    let isHome = (match.homeTeam.id === teamId);
    let opponentName = isHome ? match.awayTeam.name : match.homeTeam.name;
    
    // Busca os gols (fullTime, se não tiver, usa halfTime)
    let homeScore = match.score?.fullTime?.home ?? match.score?.halfTime?.home ?? 0;
    let awayScore = match.score?.fullTime?.away ?? match.score?.halfTime?.away ?? 0;
    
    let ourScore = isHome ? homeScore : awayScore;
    let opponentScore = isHome ? awayScore : homeScore;
    
    // Minuto do jogo
    let minute = match.minute || '';
    let statusText = '🔴 AO VIVO';
    if (match.status === 'PAUSED') statusText = '⏸️ INTERVALO';
    
    let minuteDisplay = '';
    if (minute && minute > 0) {
        minuteDisplay = `${minute}'`;
    } else if (match.status === 'PAUSED') {
        minuteDisplay = 'Intervalo';
    } else {
        minuteDisplay = '1º Tempo';
    }
    
    // Limita nome do adversário
    let shortOpp = opponentName.length > 18 ? opponentName.substring(0, 16) + '..' : opponentName;
    
    return `
        <div class="ao-vivo-badge">${statusText}</div>
        <div class="placar-destaque">${ourScore} x ${opponentScore}</div>
        <div class="partida-status">vs ${shortOpp} • ${minuteDisplay}</div>
    `;
}

// Renderiza PRÓXIMO JOGO (quando não tem ao vivo)
function renderNextMatch(nextMatch, teamId) {
    let isHome = (nextMatch.homeTeam.id === teamId);
    let opponentName = isHome ? nextMatch.awayTeam.name : nextMatch.homeTeam.name;
    
    const matchDate = new Date(nextMatch.utcDate);
    const diaSemana = matchDate.toLocaleDateString('pt-BR', { weekday: 'short' });
    const dia = matchDate.getDate();
    const mes = matchDate.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    const horas = matchDate.getHours().toString().padStart(2, '0');
    const minutos = matchDate.getMinutes().toString().padStart(2, '0');
    
    let dataFormatada = `${diaSemana.charAt(0).toUpperCase() + diaSemana.slice(1)} • ${dia}/${mes} • ${horas}h${minutos}`;
    
    // Local aproximado
    let local = isHome ? 'Maracanã' : (nextMatch.venue || 'Estádio');
    
    let shortOpp = opponentName.length > 20 ? opponentName.substring(0, 18) + '..' : opponentName;
    
    return `
        <div class="nenhum-jogo">⚽ Nenhum jogo ao vivo</div>
        <div class="proximo-jogo">
            ⏩ PRÓXIMO: ${shortOpp}<br>
            📅 ${dataFormatada} • ${local}
        </div>
    `;
}

// Renderiza fallback quando a API falha ou não retorna dados
function renderFluFallback() {
    return `
        <div class="nenhum-jogo">⚽ Nenhum jogo ao vivo</div>
        <div class="proximo-jogo">
            Próximo: Fluminense x Vasco<br>
            Sábado • 16h • Maracanã
        </div>
    `;
}

function renderBrasilFallback() {
    return `
        <div class="nenhum-jogo">⚽ Nenhum jogo ao vivo</div>
        <div class="proximo-jogo">
            Próximo: Brasil x Argentina<br>
            Terça • 21h30 • Estádio Nacional
        </div>
    `;
}

// Atualiza o placar do Fluminense
async function updateFluminenseScore() {
    const matches = await fetchTeamMatches(FLU_ID);
    const fluContent = document.getElementById('fluPlacarContent');
    
    if (matches && matches.length > 0) {
        const { live, next } = processMatches(matches, 'Fluminense');
        if (live) {
            fluContent.innerHTML = renderLiveMatch(live, FLU_ID);
        } else if (next) {
            fluContent.innerHTML = renderNextMatch(next, FLU_ID);
        } else {
            fluContent.innerHTML = renderFluFallback();
        }
    } else {
        fluContent.innerHTML = renderFluFallback();
    }
}

// Atualiza o placar do Brasil
async function updateBrasilScore() {
    const matches = await fetchTeamMatches(BRAZIL_ID);
    const brasilContent = document.getElementById('brasilPlacarContent');
    
    if (matches && matches.length > 0) {
        const { live, next } = processMatches(matches, 'Brasil');
        if (live) {
            brasilContent.innerHTML = renderLiveMatch(live, BRAZIL_ID);
        } else if (next) {
            brasilContent.innerHTML = renderNextMatch(next, BRAZIL_ID);
        } else {
            brasilContent.innerHTML = renderBrasilFallback();
        }
    } else {
        brasilContent.innerHTML = renderBrasilFallback();
    }
}

// Atualiza ambos os placares
function updateAllScores() {
    updateFluminenseScore
    updateBrasilScore();
}

// Atualiza a cada 45 segundos (para manter jogo ao vivo sincronizado)
updateAllScores();
setInterval(updateAllScores, 45000);

// ===== FIM DO CÓDIGO DOS PLACARES =====

</script>
</body>
</html>
