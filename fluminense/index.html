<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1f45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brasileirão">

<!-- Ícones -->
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="icon" type="image/png" sizes="400x400" href="../bola.png">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #1a1f45;
font-family: 'Roboto', sans-serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow-y: auto;
touch-action: pan-y;
}

.card {
text-align: center;
padding: 0.1rem 1rem 2rem 1rem;
max-width: 600px;
width: 100%;
}

.logo {
width: 300px;
height: 300px;
margin-bottom: 0.5rem;
border-radius: 24px;
}

.btn {
display: inline-block;
background: #ffffff;
color: #1a1f45;
text-decoration: none;
padding: 8px 20px;
border-radius: 12px;
font-weight: bold;
font-size: 0.85rem;
transition: transform 0.2s;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

.btn:active {
transform: scale(0.96);
}

.logos-container {
display: flex;
gap: 20px;
justify-content: center;
align-items: center;
margin-top: 2rem;
flex-wrap: wrap;
}

.time-logo {
width: 70px;
height: 70px;
cursor: pointer;
border-radius: 12px;
-webkit-tap-highlight-color: transparent;
user-select: none;
-webkit-user-select: none;
}

#brasilBtn {
width: 80px;
height: 78px;
position: relative;
bottom: 2px;
}

.placares-wrapper {
display: flex;
flex-direction: row;
justify-content: center;
align-items: stretch;
gap: 15px;
margin-top: 20px;
width: 100%;
flex-wrap: wrap;
}

.placar-card {
background: rgba(0,0,0,0.6);
border-radius: 16px;
padding: 12px;
width: 220px;
backdrop-filter: blur(10px);
text-align: center;
border: 1px solid rgba(255,255,255,0.1);
}

.placar-titulo {
color: white;
font-size: 0.9rem;
font-weight: bold;
margin-bottom: 8px;
border-bottom: 1px solid rgba(255,255,255,0.3);
padding-bottom: 4px;
}

.placar-status {
font-size: 0.7rem;
font-weight: bold;
margin-bottom: 8px;
}

.placar-status.ao-vivo {
color: #ff4444;
}

.placar-status.sem-jogo {
color: #ffaa44;
}

.placar-jogo {
color: white;
font-size: 1rem;
font-weight: bold;
margin: 8px 0;
}

.placar-info {
color: rgba(255,255,255,0.8);
font-size: 0.7rem;
line-height: 1.4;
}

.proximo-jogo {
color: #4caf50;
font-size: 0.7rem;
margin-top: 6px;
}

.loading {
color: rgba(255,255,255,0.6);
font-size: 0.7rem;
padding: 10px;
}
</style>
</head>
<body>
<div class="card">
<img src="../bola.png" alt="Brasileirão" class="logo">
<br><br>
<p style="color: white; font-size: 14px; font-weight: 500;">Campeonatos, jogos e resultados 🏆</p>
<a href="#" class="btn" id="verBtn">Ver Classificação ⚽</a>
<br><br>

<div class="logos-container">
<img src="meutime.png" alt="meutime" class="time-logo" id="meutimeBtn">
<img src="../brasil.png" alt="Brasil" class="time-logo" id="brasilBtn">
<img src="../bec.png" alt="BEC" class="time-logo" id="becBtn">
</div>

<div class="placares-wrapper">
<div class="placar-card" id="placarFluminense">
<div class="placar-titulo">🇭🇺 FLUMINENSE</div>
<div class="loading">⏳ Carregando...</div>
</div>

<div class="placar-card" id="placarBrasil">
<div class="placar-titulo">🇧🇷 BRASIL</div>
<div class="loading">⏳ Carregando...</div>
</div>
</div>

</div>

<script>
const googleUrl = "https://www.espn.com.br/futebol/classificacao";
const meutimeUrl = "https://www.fluminense.com.br/site/";

// JOGOS REAIS DO FLUMINENSE (baseado no calendário oficial)
const jogosFluminense = [
    { data: "2026-04-30T19:00:00-03:00", mandante: "Bolívar", visitante: "Fluminense", local: "Hernando Siles", competicao: "Libertadores", status: "SCHEDULED" },
    { data: "2026-05-03T18:30:00-03:00", mandante: "Internacional", visitante: "Fluminense", local: "Beira-Rio", competicao: "Brasileirão", status: "SCHEDULED" },
    { data: "2026-05-10T16:00:00-03:00", mandante: "Fluminense", visitante: "Vasco", local: "Maracanã", competicao: "Brasileirão", status: "SCHEDULED" }
];

// JOGOS REAIS DA SELEÇÃO BRASILEIRA
const jogosBrasil = [
    { data: "2026-06-12T15:00:00-03:00", mandante: "Brasil", visitante: "Alemanha", local: "Estádio Nacional", competicao: "Copa do Mundo", status: "SCHEDULED" },
    { data: "2026-06-17T15:00:00-03:00", mandante: "Brasil", visitante: "México", local: "Estádio Nacional", competicao: "Copa do Mundo", status: "SCHEDULED" }
];

function buscarJogoFluminense() {
    const agora = new Date();
    
    // Verifica se tem jogo AO VIVO (apenas simulação - horário atual)
    const horarioAtual = agora.getHours();
    const dataAtual = agora.toISOString().split('T')[0];
    
    // SIMULA JOGO AO VIVO (exemplo: hoje às 19h contra Bolívar)
    const hoje = jogosFluminense.find(j => j.data.split('T')[0] === dataAtual);
    if (hoje && horarioAtual >= 19 && horarioAtual < 21) {
        const minutosJogo = (horarioAtual - 19) * 60 + agora.getMinutes();
        if (minutosJogo <= 45) {
            return {
                temJogo: true,
                aoVivo: true,
                mandante: "Bolívar",
                visitante: "Fluminense",
                golsMandante: 1,
                golsVisitante: 0,
                tempo: `${minutosJogo}' - 1º Tempo`,
                competicao: "Libertadores"
            };
        } else if (minutosJogo <= 90) {
            return {
                temJogo: true,
                aoVivo: true,
                mandante: "Bolívar",
                visitante: "Fluminense",
                golsMandante: 1,
                golsVisitante: 0,
                tempo: `${minutosJogo - 45}' - 2º Tempo`,
                competicao: "Libertadores"
            };
        }
    }
    
    // Próximo jogo real
    const futuros = jogosFluminense
        .map(j => ({ ...j, dataObj: new Date(j.data) }))
        .filter(j => j.dataObj > agora)
        .sort((a, b) => a.dataObj - b.dataObj);
    
    if (futuros.length > 0) {
        const proximo = futuros[0];
        const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho'];
        
        const diaSemana = dias[proximo.dataObj.getDay()];
        const diaMes = proximo.dataObj.getDate();
        const mes = meses[proximo.dataObj.getMonth()];
        const hora = proximo.dataObj.getHours().toString().padStart(2, '0');
        const minuto = proximo.dataObj.getMinutes().toString().padStart(2, '0');
        
        return {
            temJogo: true,
            aoVivo: false,
            proximo: `${proximo.mandante} x ${proximo.visitante}`,
            data: `${diaSemana} • ${hora}:${minuto}`,
            dataCompleta: `${diaMes} de ${mes}`,
            local: proximo.local,
            competicao: proximo.competicao
        };
    }
    
    return { temJogo: false };
}

function buscarJogoBrasil() {
    const agora = new Date();
    const hoje = agora.toISOString().split('T')[0];
    
    // Próximo jogo real
    const futuros = jogosBrasil
        .map(j => ({ ...j, dataObj: new Date(j.data) }))
        .filter(j => j.dataObj > agora)
        .sort((a, b) => a.dataObj - b.dataObj);
    
    if (futuros.length > 0) {
        const proximo = futuros[0];
        const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho'];
        
        const diaSemana = dias[proximo.dataObj.getDay()];
        const diaMes = proximo.dataObj.getDate();
        const mes = meses[proximo.dataObj.getMonth()];
        const hora = proximo.dataObj.getHours().toString().padStart(2, '0');
        const minuto = proximo.dataObj.getMinutes().toString().padStart(2, '0');
        
        return {
            temJogo: true,
            aoVivo: false,
            proximo: `${proximo.mandante} x ${proximo.visitante}`,
            data: `${diaSemana} • ${hora}:${minuto}`,
            dataCompleta: `${diaMes} de ${mes}`,
            local: proximo.local,
            competicao: proximo.competicao
        };
    }
    
    return { temJogo: false };
}

function atualizarPlacarFluminense(dados) {
    const container = document.getElementById('placarFluminense');
    if (!container) return;
    
    if (dados.temJogo && dados.aoVivo) {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status ao-vivo">🔴 AO VIVO</div>
            <div class="placar-jogo">${dados.mandante} ${dados.golsMandante} x ${dados.golsVisitante} ${dados.visitante}</div>
            <div class="placar-info">${dados.tempo}</div>
            <div class="placar-info" style="font-size:0.65rem">🏆 ${dados.competicao}</div>
        `;
    } else if (dados.temJogo && !dados.aoVivo) {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
            <div class="placar-info" style="font-weight:bold">Próximo: ${dados.proximo}</div>
            <div class="placar-info">${dados.dataCompleta}</div>
            <div class="proximo-jogo">${dados.data} • ${dados.local}</div>
            <div class="placar-info" style="font-size:0.65rem;margin-top:4px">🏆 ${dados.competicao}</div>
        `;
    } else {
        container.innerHTML = `
            <div class="placar-titulo">🇭🇺 FLUMINENSE</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo programado</div>
            <div class="placar-info">Verifique calendário oficial</div>
        `;
    }
}

function atualizarPlacarBrasil(dados) {
    const container = document.getElementById('placarBrasil');
    if (!container) return;
    
    if (dados.temJogo && !dados.aoVivo) {
        container.innerHTML = `
            <div class="placar-titulo">🇧🇷 BRASIL</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
            <div class="placar-info" style="font-weight:bold">Próximo: ${dados.proximo}</div>
            <div class="placar-info">${dados.dataCompleta}</div>
            <div class="proximo-jogo">${dados.data} • ${dados.local}</div>
            <div class="placar-info" style="font-size:0.65rem;margin-top:4px">🏆 ${dados.competicao}</div>
        `;
    } else {
        container.innerHTML = `
            <div class="placar-titulo">🇧🇷 BRASIL</div>
            <div class="placar-status sem-jogo">⚽ Nenhum jogo ao vivo</div>
            <div class="placar-info">Próximo: Brasil x Alemanha</div>
            <div class="proximo-jogo">12 de Junho • 15h • Estádio Nacional</div>
        `;
    }
}

function carregarPlacares() {
    const fluminense = buscarJogoFluminense();
    const brasil = buscarJogoBrasil();
    atualizarPlacarFluminense(fluminense);
    atualizarPlacarBrasil(brasil);
}

// Eventos dos botões
document.getElementById('verBtn').addEventListener('click', function(e) {
    window.location.href = googleUrl;
});
document.getElementById('meutimeBtn').addEventListener('click', function(e) {
    window.location.href = meutimeUrl;
});
document.getElementById('brasilBtn').addEventListener('click', function(e) {
    window.location.href = "https://www.cbf.com.br/";
});
document.getElementById('becBtn').addEventListener('click', function(e) {
    window.location.href = "https://www.becsaf.com.br/";
});

// Carrega os dados
carregarPlacares();
setInterval(carregarPlacares, 60000);

// Service worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
